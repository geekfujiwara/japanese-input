<!DOCTYPE html>

<body style="font-family: -apple-system, 'Hiragino Sans'; font-size: 13px;">
<p style="font-size: 44px; color: #4f9e6e; text-align: center; margin: 10px 0 0 0;">✓</p>
<h2 style="font-size: 19px; text-align: center; margin: 0 0 6px 0;">インストールが終わりました</h2>
<p style="text-align: center; margin: 0 0 18px 0;">続きは、開いた「Astelio のセットアップ」ウィザードで行います。</p>

<p style="margin: 0 0 4px 0;"><b>ウィザードが見当たらないとき</b></p>
<p style="margin: 0 0 10px 0; color: #888888;">Finder の［移動］→［フォルダへ移動…］で「/Library/Input Methods」を開き、「AstelioIME」をダブルクリックしてください。</p>
<p style="margin: 0 0 4px 0;"><b>あとから設定を変えるとき</b></p>
<p style="margin: 0; color: #888888;">入力メニューの「Astelio の設定を開く…」から開けます。ウィザードは［はじめに］→［セットアップウィザードを開く］で開き直せます。</p>
</body>
</html>
