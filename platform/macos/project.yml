# Xcode project of the macOS input method. Generate it with `xcodegen generate` in this folder (tools/build-astelio-mac.sh
# does it for you); AstelioIME.xcodeproj is not committed.
name: AstelioIME
options:
  bundleIdPrefix: com.geekfujiwara
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_OBJC_ARC: YES
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../../core/include
      - $(SRCROOT)/engine/include
    GCC_PREPROCESSOR_DEFINITIONS:
      - $(inherited)
      - ASTELIO_CORE_VERSION=\"$(MARKETING_VERSION)\"
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
      ARCHS: "arm64 x86_64"

targets:
  # The C++ Core, the platform-independent engine and the Objective-C++ bridge, linked by the app and the tests.
  AstelioEngine:
    type: library.static
    platform: macOS
    sources:
      - path: ../../core/src
      - path: engine/src
      - path: AstelioIME/Bridge
    settings:
      base:
        PRODUCT_NAME: AstelioEngine
        SKIP_INSTALL: YES

  AstelioIME:
    type: application
    platform: macOS
    dependencies:
      - target: AstelioEngine
    sources:
      - path: AstelioIME
        excludes:
          - "*.entitlements"
          - Info.plist
          - Bridge/**
          - LaunchAgents/**
      # Started at login when the user turns on switching input sources with Command (ModifierSwitcher.swift).
      - path: AstelioIME/LaunchAgents/com.geekfujiwara.inputmethod.Astelio.switcher.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # Built by tools/build-astelio-mac.sh or CI from azooKey_dictionary_storage; without it only kana input works.
      - path: Dictionary/system.dic
        optional: true
        buildPhase: resources
      - path: Dictionary/LICENSE-azooKey_dictionary_storage.txt
        optional: true
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AstelioIME
        PRODUCT_BUNDLE_IDENTIFIER: com.geekfujiwara.inputmethod.Astelio
        INFOPLIST_FILE: AstelioIME/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: AstelioIME/AstelioIME-Bridging-Header.h
        # Ad hoc by default; tools/release-astelio-mac-appstore.sh sets the ASTELIO_* values for the Mac App Store
        # (passing them on the command line reaches this target only, not the static library).
        ASTELIO_ENTITLEMENTS: AstelioIME/AstelioIME.entitlements
        ASTELIO_SIGN_IDENTITY: "-"
        ASTELIO_PROFILE: ""
        ASTELIO_TEAM: ""
        # The input method's Mach service (InputMethodConnectionName) is "<app group>.Connection": the App Sandbox
        # lets the app register names under its app group without a temporary exception.
        ASTELIO_APP_GROUP: 72XRBY5B5K.$(PRODUCT_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: $(ASTELIO_ENTITLEMENTS)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(ASTELIO_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(ASTELIO_PROFILE)
        DEVELOPMENT_TEAM: $(ASTELIO_TEAM)
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]

  AstelioIMETests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: AstelioEngine
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.geekfujiwara.inputmethod.AstelioTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: Tests/AstelioIMETests-Bridging-Header.h
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: ["$(inherited)", "-lc++"]

schemes:
  AstelioIME:
    build:
      targets:
        AstelioIME: all
        AstelioIMETests: [test]
    test:
      targets:
        - AstelioIMETests
