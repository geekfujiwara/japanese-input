name: SLM comparison

# T-S06: compares "もしかして" methods: the dictionary proposes words one key slip away, then an algorithm or a
# bundled-SLM candidate (plan 4.5.3) picks one or none.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
  pull_request:
    paths:
      - 'slm/**'
      - 'core/src/typo_candidates.cpp'
      - 'eval/src/typo_main.cpp'
      - '.github/workflows/slm-eval.yml'

permissions:
  contents: read

env:
  LLAMA_TAG: b11191
  LLAMA_SHA256: ecf99c49b7626fed1d699e789e31d7cd5a20ddd08222b0fdc65f61208f20e3bc

jobs:
  candidates:
    name: Typo candidates and algorithms
    runs-on: ubuntu-latest
    env:
      AZOOKEY_COMMIT: 4d418525b090cf49c219819d05a7e3cc2a4346eb
      AZOOKEY_SHA256: 9a4f66c3f4b6a80d59471eb7890209faf49a6c856e7a72c1a6f9b862266aa026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the system dictionary
        run: |
          curl -fsSL -o azookey.tar.gz "https://github.com/azooKey/azooKey_dictionary_storage/archive/${AZOOKEY_COMMIT}.tar.gz"
          echo "${AZOOKEY_SHA256}  azookey.tar.gz" | sha256sum -c -
          mkdir -p build/azookey
          tar -xzf azookey.tar.gz -C build/azookey --strip-components=1
          cmake -S . -B build/tools -DCMAKE_BUILD_TYPE=Release -DASTELIO_BUILD_TESTS=OFF
          cmake --build build/tools --target astelio_dicbuild astelio_typo
          build/tools/dictionary/tools/astelio_dicbuild import-azookey build/azookey/Dictionary build/words.tsv build/connection.tsv
          build/tools/dictionary/tools/astelio_dicbuild build build/connection.tsv build/system.dic build/words.tsv
      - name: Find the typo candidates
        run: build/tools/eval/astelio_typo build/system.dic slm/corpus/typo.tsv candidates.json
      - name: Score the algorithms (no SLM)
        run: |
          mkdir -p results
          for method in algo-cost algo-margin; do
            python3 slm/evaluate.py --method "$method" --name "$method" --candidates candidates.json --output "results/${method}.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slm-candidates
          path: candidates.json
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slm-result-algorithms
          path: results/
          retention-days: 30

  evaluate:
    name: Evaluate (${{ matrix.model }})
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model:
          - sarashina2.2-0.5b
          - sarashina2.2-0.5b-q4
          - sarashina2.2-1b
          - qwen2.5-0.5b
          - qwen2.5-1.5b
          - qwen3-0.6b
          - qwen3-1.7b
          - llm-jp-3-1.8b
          - rakutenai-2.0-mini
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: slm-candidates
      - name: Download llama.cpp
        run: |
          curl -fsSL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tar.gz" | sha256sum -c -
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          server="$(find "$PWD/llama" -name llama-server -type f | head -n 1)"
          test -n "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$server")" >> "$GITHUB_ENV"
      - name: Download the model
        run: |
          IFS=$'\t' read -r name repo commit file sha bytes license < <(grep -P "^${MODEL}\t" slm/models.tsv)
          test "$name" = "$MODEL"
          curl -fL --retry 3 --silent --show-error -o model.gguf "https://huggingface.co/${repo}/resolve/${commit}/${file}"
          echo "${sha}  model.gguf" | sha256sum -c -
          echo "MODEL_BYTES=${bytes}" >> "$GITHUB_ENV"
      - name: Evaluate
        run: |
          # 2 threads, as the IME would use so typing and other apps keep the other cores.
          "$LLAMA_SERVER" -m model.gguf --jinja -c 2048 --host 127.0.0.1 --port 8080 -t 2 > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 150); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null; then break; fi
            if ! kill -0 "$pid" 2> /dev/null; then cat server.log; exit 1; fi
            sleep 2
          done
          mkdir -p results
          python3 slm/evaluate.py --method slm --name "$MODEL" --candidates candidates.json --output "results/${MODEL}.json" \
            --server-pid "$pid" --model-bytes "$MODEL_BYTES"
          kill "$pid"
      - name: Show the server log
        if: failure()
        run: tail -n 100 server.log || true
      - name: Upload the result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slm-result-${{ matrix.model }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Summary
    needs: [candidates, evaluate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: slm-result-*
          path: results
          merge-multiple: true
      - name: Write the report
        run: |
          python3 slm/summarize.py results/*.json > slm-report.md
          cat slm-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slm-report
          path: slm-report.md
          retention-days: 90
