name: SLM comparison

# T-S06: compares the bundled-SLM candidates (plan 4.5.3) on the "もしかして" typo corpus.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'
  pull_request:
    paths:
      - 'slm/**'
      - '.github/workflows/slm-eval.yml'

permissions:
  contents: read

env:
  LLAMA_TAG: b11191
  LLAMA_SHA256: ecf99c49b7626fed1d699e789e31d7cd5a20ddd08222b0fdc65f61208f20e3bc

jobs:
  evaluate:
    name: Evaluate (${{ matrix.model }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model:
          - sarashina2.2-0.5b
          - sarashina2.2-1b
          - qwen2.5-0.5b
          - qwen2.5-1.5b
          - qwen3-0.6b
          - qwen3-1.7b
          - llm-jp-3-1.8b
          - rakutenai-2.0-mini
    env:
      MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download llama.cpp
        run: |
          curl -fsSL -o llama.tar.gz "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMA_TAG}/llama-${LLAMA_TAG}-bin-ubuntu-x64.tar.gz"
          echo "${LLAMA_SHA256}  llama.tar.gz" | sha256sum -c -
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          server="$(find "$PWD/llama" -name llama-server -type f | head -n 1)"
          test -n "$server"
          echo "LLAMA_SERVER=$server" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$server")" >> "$GITHUB_ENV"
      - name: Download the model
        run: |
          IFS=$'\t' read -r name repo commit file sha bytes license < <(grep -P "^${MODEL}\t" slm/models.tsv)
          test "$name" = "$MODEL"
          curl -fL --retry 3 --silent --show-error -o model.gguf "https://huggingface.co/${repo}/resolve/${commit}/${file}"
          echo "${sha}  model.gguf" | sha256sum -c -
          echo "MODEL_BYTES=${bytes}" >> "$GITHUB_ENV"
      - name: Evaluate
        run: |
          "$LLAMA_SERVER" -m model.gguf --jinja -c 4096 --host 127.0.0.1 --port 8080 -t "$(nproc)" > server.log 2>&1 &
          pid=$!
          for i in $(seq 1 150); do
            if curl -fs http://127.0.0.1:8080/health > /dev/null; then break; fi
            if ! kill -0 "$pid" 2> /dev/null; then cat server.log; exit 1; fi
            sleep 2
          done
          mkdir -p results
          python3 slm/evaluate.py --name "$MODEL" --corpus slm/corpus/typo.tsv --output "results/${MODEL}.json" \
            --server-pid "$pid" --model-bytes "$MODEL_BYTES"
          kill "$pid"
      - name: Show the server log
        if: failure()
        run: tail -n 100 server.log || true
      - name: Upload the result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slm-result-${{ matrix.model }}
          path: results/
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Summary
    needs: evaluate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: slm-result-*
          path: results
          merge-multiple: true
      - name: Write the report
        run: |
          python3 slm/summarize.py results/*.json > slm-report.md
          cat slm-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: slm-report
          path: slm-report.md
          retention-days: 90
