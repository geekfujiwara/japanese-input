name: macOS TestFlight

# Builds the Mac App Store version of the input method, signs it with certificates made for this run (revoked at the
# end), uploads it to App Store Connect and gives it to the internal TestFlight testers.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      the key ID of an App Store Connect API key with the Admin role
#   ASC_ISSUER_ID   the issuer ID shown above the keys
#   ASC_KEY_P8      the contents of AuthKey_<key id>.p8
# The app record (bundle ID com.geekfujiwara.inputmethod.Astelio, platform macOS) must exist in App Store Connect;
# the first run registers the bundle ID and stops with instructions when it does not.
on:
  workflow_dispatch:
    inputs:
      tester:
        description: 'Email of an App Store Connect user to invite to internal testing (optional)'
        required: false
        default: ''
      upload:
        description: 'Upload to App Store Connect (off: only build and sign the package)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: macos-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Mac App Store build to TestFlight
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ -z "$ASC_KEY_P8" || -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" ]]; then
            echo "::error::Set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets first (see the top of this workflow)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" python3 tools/asc_mac_release.py check \
            --bundle-id com.geekfujiwara.inputmethod.Astelio
      - name: Build, sign, upload and hand to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTER: ${{ inputs.tester }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          args=(--build-number "$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))")
          [[ -n "$TESTER" ]] && args+=(--tester "$TESTER")
          [[ "$UPLOAD" == "true" ]] || args+=(--no-upload)
          tools/release-astelio-mac-appstore.sh "${args[@]}"
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
