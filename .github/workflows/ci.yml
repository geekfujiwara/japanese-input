name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-windows:
    name: Core (${{ matrix.preset }})
    runs-on: ${{ matrix.runner }}
    env:
      ASTELIO_TIP_INTEGRATION: "1"
      ASTELIO_TIP_REQUIRE_FOCUS: ${{ matrix.require_focus }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            preset: windows-arm64
            require_focus: "0"
          - runner: windows-latest
            preset: windows-x64
            require_focus: "1"
          - runner: windows-latest
            preset: windows-x86
            require_focus: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  core-macos:
    name: Core (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake --preset macos-universal
      - name: Build
        run: cmake --build --preset macos-universal
      - name: Check Universal 2 slices
        run: |
          archs="$(lipo -archs build/macos-universal/core/tests/astelio_core_tests)"
          echo "slices: ${archs}"
          [[ "${archs}" == *arm64* && "${archs}" == *x86_64* ]]
      - name: Test
        run: ctest --preset macos-universal

  core-fuzz:
    name: Core fuzzing (F-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B build/fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DASTELIO_BUILD_TESTS=OFF -DASTELIO_BUILD_FUZZERS=ON
      - name: Build
        run: cmake --build build/fuzz --target astelio_composer_fuzzer
      - name: Fuzz for 60 seconds
        run: build/fuzz/core/astelio_composer_fuzzer -max_total_time=60 -max_len=12000

  dotnet:
    name: .NET (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-11-arm, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test KotohaIME.slnx -c Release
